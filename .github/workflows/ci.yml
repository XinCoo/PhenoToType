name: CI

on:
  push:
    branches: [main, master, dev]
  pull_request:
    branches: [main, master, dev]

# 护栏策略：
#   1) unit+e2e 不启动 Electron 窗口，无需安装依赖，所有平台/Node 版本秒级跑完；
#   2) smoke 启动真实 Electron 渲染进程（走的是与用户导入相同的 file:// 流程），
#      需要 electron 包与显示器：Windows 原生跑，Linux 用 xvfb 虚拟显示。
# 注意 Node 版本避坑：必须用 >=18 且非 v22.0–22.3（ELECTRON_RUN_AS_NODE 在该区间有 bug）。

jobs:
  unit-e2e:
    name: 单元 / 端到端测试
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'
      # 单元 + 端到端不依赖 electron 运行时，跳过 npm install 加速；
      # 若后续引入第三方运行依赖，请改为 `npm ci` 后再跑。
      - run: npm run test:unit

  smoke:
    name: 渲染进程冒烟测试
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'
      # 冒烟测试 require('electron') 并启动真实窗口，必须安装 devDependencies（含 electron）
      - run: npm ci
      - name: 安装虚拟显示 (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: 运行冒烟测试 (Linux / xvfb)
        if: runner.os == 'Linux'
        run: xvfb-run -a node test/smoke/smoke.electron.cjs
      - name: 运行冒烟测试 (Windows)
        if: runner.os == 'Windows'
        run: node test/smoke/smoke.electron.cjs
